# The customer's comment list on the supplier's Pflichtenheft V 1.0 — the
# source of docs/Kommentarliste_Pflichtenheft_V1.0.xlsx.
#
# The supplier answers the Lastenheft with a Pflichtenheft (one fulfilment
# statement per requirement); the customer answers that with a comment list
# in Excel: one row per comment, the Lastenheft's ID, the comment and the
# customer's assessment (Bewertung). tools/build_comment_list_xlsx.py renders
# it. Synthetic: the Beispielbahn and its comments are invented.
#
# The rows cover what a reader of such a list meets: an accepted, a rejected,
# a question and a counter-proposal (the assessment column), an ID the
# Lastenheft does not have (PM.19), a comment that names its requirement only
# in its text and has no assessment, and a general remark about no
# requirement.
title: Kommentarliste zum Pflichtenheft Teilsystem Weiche V 1.0
